# Fail2Ban filter for BIND9 DNS query cache refusals and unauthorized zone transfers
# Compatible with modern BIND 9.18+ "denied (allow-query-cache did not match)" logging format

[Definition]

_daemon = named(?:-\w+)?

failregex = ^(?:\[\])?\s*(?:\S+\s+)?(?:kernel:\s?\[ *\d+\.\d+\]:?\s+)?(?:@vserver_\S+\s+)?(?:(?:(?:\[\d+\])?:\s+[\[\(]?%(_daemon)s(?:\(\S+\))?[\]\)]?:?|[\[\(]?%(_daemon)s(?:\(\S+\))?[\]\)]?:?(?:\[\d+\])?:?)\s+)?client(?: @\S*)? <HOST>#\S+(?: \([\S.]+\))?: query(?: \(cache\))?.*denied
            ^(?:\[\])?\s*(?:\S+\s+)?(?:kernel:\s?\[ *\d+\.\d+\]:?\s+)?(?:@vserver_\S+\s+)?(?:(?:(?:\[\d+\])?:\s+[\[\(]?%(_daemon)s(?:\(\S+\))?[\]\)]?:?|[\[\(]?%(_daemon)s(?:\(\S+\))?[\]\)]?:?(?:\[\d+\])?:?)\s+)?client(?: @\S*)? <HOST>#\S+(?: \([\S.]+\))?: bad zone transfer request

ignoreregex =

# Fail2Ban filter for Squid HTTP Proxy unauthorized access attempts
# Detects TCP_DENIED/403, NONE_NONE/400 (malformed proxy requests), and NONE/405

[Definition]

failregex = ^\s+\d+\s+<HOST>\s+(?:[A-Z_]+_DENIED/403|NONE_NONE/400|NONE/405)\s+.*$

ignoreregex =

datepattern = {^LN-BEG}Epoch
              {^LN-BEG}

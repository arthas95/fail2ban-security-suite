# Fail2Ban filter for Apache probe scanners and web vulnerability exploits
# Detects sensitive file hunting (.env, .git, aws, database backups, phpinfo, admin panels)
# and core Apache path traversal attacks (AH10244) or cgi execution probes (AH02811)

[Definition]

failregex = ^<HOST> - - \[.*?\] "(?:GET|POST|HEAD) \/(?:\.env|\.git|\.aws|\.ssh|wp-config|config\.|sftp|database\.php|phpinfo|xmlrpc|phpmyadmin|\.vscode|\.docker|vendor\/phpunit|ecp\/Current).*"
            \[client <HOST>(?::\d+)?\] (?:AH\d+: )?(?:invalid URI path|stderr from .*: script not found|client denied by server configuration)

ignoreregex =

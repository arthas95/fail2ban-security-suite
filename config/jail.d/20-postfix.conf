# Postfix SMTP / SASL Protection
# Protects against authentication brute-force, unauthorized relaying, and mail flood.
# Uses mode = extra to avoid false positives on standard TCP monitoring checks (UptimeRobot, etc.)

[postfix]
enabled     = true
port        = smtp,465,submission
logpath     = /var/log/mail.log
mode        = extra
maxretry    = 3
findtime    = 15m
bantime     = 1h
ignoreregex = lost connection after CONNECT from .*(?:uptimerobot|statuscake|pingdom)

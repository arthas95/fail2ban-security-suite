# Apache Web Server Protection
# Multi-layered defense covering HTTP basic auth failures, malicious crawlers,
# sensitive path probing (.env, .git, aws, configs), and path traversal attempts.

[apache-auth]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/*error.log
maxretry = 3
findtime = 15m
bantime  = 1h

[apache-badbots]
enabled  = true
port     = http,https
logpath  = /var/log/apache2/*access.log
maxretry = 2
findtime = 1d
bantime  = 24h

[apache-scanners]
enabled  = true
port     = http,https
filter   = apache-scanners
logpath  = /var/log/apache2/*access.log
           /var/log/apache2/*error.log
maxretry = 2
findtime = 1h
bantime  = 24h

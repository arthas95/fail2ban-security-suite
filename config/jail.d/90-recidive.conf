# Recidive Jail (Ultimate Defense Layer)
# Evaluates offender history across ALL jails from /var/log/fail2ban.log.
# Repeat offenders who trigger bans multiple times are banned across ALL ports for a full week.

[recidive]
enabled   = true
logpath   = /var/log/fail2ban.log
banaction = %(banaction_allports)s
bantime   = 1w
findtime  = 1d
maxretry  = 5

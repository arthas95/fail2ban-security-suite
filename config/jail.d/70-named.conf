# BIND9 DNS Server Protection
# Protects against recursive DNS cache exploitation, amplification vectors,
# and unauthorized zone transfer attempts (AXFR/IXFR).

[named-refused]
enabled  = true
port     = 53
protocol = tcp,udp
filter   = named-refused-custom
logpath  = /var/log/syslog
maxretry = 3
findtime = 30m
bantime  = 6h

# MariaDB / MySQL Protection
# Protects exposed database ports against unauthorized root/user connection attempts
# and credential brute-force attacks via systemd journal integration.

[mariadb-auth]
enabled      = true
port         = 3306
filter       = mysqld-auth
backend      = systemd
journalmatch = _SYSTEMD_UNIT=mariadb.service
maxretry     = 3
findtime     = 30m
bantime      = 2h
